[package]
name = "treechord"
version = "0.1.0"
edition = "2021"
description = "Raise-or-run application launcher bound to Win+key chords"
build = "build.rs"

[features]
# Testing only: let the keyboard hook react to synthetic (injected) key events.
test-injected = []

[dependencies]
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
